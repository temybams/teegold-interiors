name: teegold

services:
  db:
    image: postgres:16-alpine
    container_name: teegold-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teegold
      POSTGRES_PASSWORD: teegold
      POSTGRES_DB: teegold
    # Host port 5433 keeps this out of the way of any other Postgres on 5432.
    ports:
      - '5433:5432'
    volumes:
      - teegold-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teegold -d teegold']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  teegold-db-data:
