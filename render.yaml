# Teegold — production on Render
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy:
# 1. Put the Render web URL into Vercel as NEXT_PUBLIC_API_URL
# 2. Put the Vercel URL into this service as CLIENT_ORIGIN
# 3. Run one-time seed (Render Shell): yarn db:seed
# 4. Optionally add SMTP_* for real email

databases:
  - name: teegold-db
    plan: free
    databaseName: teegold
    user: teegold

services:
  - type: web
    name: teegold-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: yarn --cwd ../shared install && yarn --cwd ../shared build && yarn install && yarn build
    startCommand: yarn start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        # Prisma 7 + @prisma/streams-local need ^22.12 (or >=24)
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teegold-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: MAIL_FROM
        value: Teegold Interiors <hello@teegoldinteriors.ng>
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
